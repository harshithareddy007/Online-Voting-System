<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vote Successful</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1f3d 0%, #001233 100%);
      min-height: 100vh;
      margin: 0;
      color: #e0e1dd;
      overflow: hidden;
    }

    .navbar {
      background: #000;
      border-bottom: 5px solid #FF9933;
      padding: 16px 0;
    }

    .main-container {
      padding: 85px 20px 50px;
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 520px;
      padding: 50px 40px;
      color: #001233;
      text-align: center;
    }

    .success-icon {
      font-size: 4.5rem;
      color: #22c55e;
      margin-bottom: 20px;
    }

    .voting-id {
      font-size: 1.35rem;
      font-weight: 600;
      background: #f8fafc;
      padding: 12px 20px;
      border-radius: 10px;
      margin: 20px 0;
      color: #1e293b;
    }

    .home-btn {
      background: linear-gradient(90deg, #001233, #0a1f3d);
      color: white;
      font-weight: 600;
      padding: 14px 32px;
      border: none;
      border-radius: 10px;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar fixed-top">
    <div class="container-fluid px-5">
      <div class="d-flex align-items-center gap-3">
        <i class="fas fa-landmark fa-2x text-white"></i>
        <span class="text-white fw-bold fs-4">GOVERNMENT OF INDIA</span>
        <span class="text-white-50 ms-3">| Secure E-Voting Portal</span>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <div class="glass-card">

      <div class="success-icon">✅</div>
      <h1 style="color: #15803d; font-weight: 700;">Vote Successful</h1>

      <p class="mt-3">Your vote has been securely recorded.</p>

      <div class="voting-id">
        Voting ID: <strong>{{ vote_id }}</strong>
      </div>

      <p class="text-muted">{{ time }}</p>

      <p class="small text-muted mt-4">
        Please save this ID for your reference.
      </p>

      <form action="/" method="get">
        <button type="submit" class="home-btn">
          🔒 Close & Return to Home
        </button>
      </form>

      <p class="mt-4 small text-success">
        🔐 Your vote is encrypted and securely stored in the system.
      </p>

    </div>
  </div>

</body>
</html>
