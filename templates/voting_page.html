<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cast Your Vote</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1f3d 0%, #001233 100%);
      min-height: 100vh;
      margin: 0;
      color: #e0e1dd;
      overflow: hidden;
    }

    .navbar {
      background: #000;
      border-bottom: 5px solid #FF9933;
      padding: 16px 0;
    }

    .main-container {
      padding: 85px 20px 50px;
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 680px;
      padding: 45px 40px;
      color: #001233;
    }

    .header-title {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtext {
      color: #555;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-select {
      padding: 14px 16px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      font-size: 1.05rem;
    }

    .vote-btn {
      background: linear-gradient(90deg, #138808, #22c55e);
      color: white;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 10px;
      width: 100%;
      font-size: 1.1rem;
      margin-top: 20px;
    }

    .vote-btn:hover {
      background: #138808;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar fixed-top">
    <div class="container-fluid px-5">
      <div class="d-flex align-items-center gap-3">
        <i class="fas fa-landmark fa-2x text-white"></i>
        <span class="text-white fw-bold fs-4">GOVERNMENT OF INDIA</span>
        <span class="text-white-50 ms-3">| Secure E-Voting Portal</span>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <div class="glass-card">

      <h1 class="header-title">Cast Your Vote</h1>
      <p class="subtext">Choose your candidate carefully. This action cannot be undone.</p>

      <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
          <label class="form-label fw-medium">Select Candidate</label>
          <select name="candidate_id" class="form-select" required>
            <option value="" disabled selected>-- Select Candidate --</option>
            {% for candidate in candidates %}
            <option value="{{ candidate.id }}">{{ candidate.name }} ({{ candidate.party }})</option>
            {% endfor %}
          </select>
        </div>

        <button type="submit" class="vote-btn">
          Submit Vote
        </button>
      </form>

    </div>
  </div>

</body>
</html>
