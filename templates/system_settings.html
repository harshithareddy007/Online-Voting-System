<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>System Settings - Admin Panel</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1f3d 0%, #001233 100%);
      min-height: 100vh;
      margin: 0;
      color: #e0e1dd;
    }

    .navbar {
      background: #000;
      border-bottom: 5px solid #FF9933;
      padding: 16px 0;
    }

    .main-container {
      padding: 85px 20px 50px;
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 500px;
      padding: 40px;
      color: #001233;
      position: relative;
      text-align: center;
    }

    .header-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .back-btn {
      position: absolute;
      top: 25px;
      right: 35px;
      background: #1e293b;
      color: white;
      padding: 8px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
    }

    .reset-btn {
      background: #ef4444;
      color: white;
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar fixed-top">
    <div class="container-fluid px-5">
      <div class="d-flex align-items-center gap-3">
        <i class="fas fa-landmark fa-2x text-white"></i>
        <span class="text-white fw-bold fs-4">GOVERNMENT OF INDIA</span>
        <span class="text-white-50 ms-3">| Secure E-Voting Portal</span>
      </div>
      
      <div class="d-flex align-items-center gap-4">
        <a href="{% url 'admin_dashboard' %}" class="text-white fw-medium">Dashboard</a>
        <a href="{% url 'admin_logout' %}" class="btn btn-danger px-4 py-2 fw-medium">Logout</a>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <div class="glass-card">

      <h1 class="header-title">System Settings</h1>

      <form method="POST">
        {% csrf_token %}
        <button type="submit" name="reset_election" class="reset-btn">
          Reset Election
        </button>
      </form>

      <p class="text-danger mt-4 small">
        Warning: This action will clear all election data and cannot be undone.
      </p>

    </div>
  </div>

</body>
</html>
