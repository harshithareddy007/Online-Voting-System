<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Administrator Login - E-Voting Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1f3d 0%, #001233 100%);
      min-height: 100vh;
      color: #fff;
      position: relative;
    }

    .navbar {
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 4px solid #FF9933;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      max-width: 440px;
      width: 100%;
      padding: 45px 40px;
      border: 1px solid rgba(255, 153, 51, 0.25);
      color: #001233;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #001233;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #555;
      font-size: 1.05rem;
      margin-bottom: 30px;
    }

    .form-label {
      font-weight: 500;
      color: #333;
      margin-bottom: 6px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1.05rem;
      transition: all 0.3s ease;
    }

    .auth-input:focus {
      border-color: #FF9933;
      box-shadow: 0 0 0 4px rgba(255, 153, 51, 0.15);
      outline: none;
    }

    .btn-login {
      background: linear-gradient(90deg, #001233, #0a1f3d);
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 14px;
      border: none;
      border-radius: 10px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 18, 51, 0.4);
      color: white;
    }

    .back-link {
      color: #FF9933;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      color: #138808;
    }

    .secure-badge {
      color: #138808;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center gap-3">
        <i class="fas fa-landmark fa-2x text-white"></i>
        <span class="navbar-brand text-white fw-bold fs-4">GOVERNMENT OF INDIA</span>
      </div>
      <span class="text-white fw-bold fs-5">E-VOTING PORTAL</span>
    </div>
  </nav>

  <div class="d-flex align-items-center justify-content-center min-vh-100 p-4 pt-5">
    <div class="glass-card text-center">
      
      <h1>Administrator Login</h1>
      <p class="subtitle">Authorized Election Officials Only</p>

      {% if error %}
        <div class="alert alert-danger py-2 mb-4" role="alert">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="text-start">
          <label class="form-label">Admin Email / ID</label>
          <input 
            type="text" 
            name="username" 
            class="auth-input" 
            placeholder="Enter your official email or ID"
            required 
            autocomplete="username"
          />
        </div>

        <div class="text-start">
          <label class="form-label">Password</label>
          <input 
            type="password" 
            name="password" 
            class="auth-input" 
            placeholder="Enter password"
            required 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn btn-login mt-2">
          <i class="fas fa-sign-in-alt me-2"></i>
          LOGIN
        </button>
      </form>

      <div class="mt-4">
        <a href="/" class="back-link">
          ← Back to Home
        </a>
      </div>

      <div class="mt-5 pt-4 border-top d-flex align-items-center justify-content-center gap-2 secure-badge">
        <i class="fas fa-lock"></i>
        <span>Secure 256-bit Encrypted Session • Official Use Only</span>
      </div>
    </div>
  </div>

</body>
</html>
