<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voter Authentication</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1f3d 0%, #001233 100%);
      min-height: 100vh;
      margin: 0;
      color: #e0e1dd;
      overflow: hidden;
    }

    .navbar {
      background: #000;
      border-bottom: 5px solid #FF9933;
      padding: 16px 0;
    }

    .main-container {
      height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .glass-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 460px;
      padding: 45px 40px;
      color: #001233;
      text-align: center;
    }

    .header-title {
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtext {
      color: #555;
      margin-bottom: 30px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1.05rem;
    }

    .auth-input:focus {
      border-color: #FF9933;
      box-shadow: 0 0 0 4px rgba(255, 153, 51, 0.15);
      outline: none;
    }

    .verify-btn {
      background: linear-gradient(90deg, #001233, #0a1f3d);
      color: white;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 10px;
      width: 100%;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar fixed-top">
    <div class="container-fluid px-5">
      <div class="d-flex align-items-center gap-3">
        <i class="fas fa-landmark fa-2x text-white"></i>
        <span class="text-white fw-bold fs-4">GOVERNMENT OF INDIA</span>
        <span class="text-white-50 ms-3">| Secure E-Voting Portal</span>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <div class="glass-card">

      <h1 class="header-title">Voter Authentication</h1>
      <p class="subtext">Enter your EPIC Number and Aadhaar Number</p>

      <form method="POST" action="{% url 'voter_authentication' %}">
        {% csrf_token %}

        <input type="text" name="epic" class="auth-input" placeholder="Enter EPIC Number" required>
        <input type="text" name="aadhaar" class="auth-input" placeholder="Enter Aadhaar Number" required>

        <button type="submit" class="verify-btn">
          <i class="fas fa-id-card me-2"></i> VERIFY IDENTITY
        </button>
      </form>

      {% if error %}
        <p class="text-danger mt-3">{{ error }}</p>
      {% endif %}

    </div>
  </div>

</body>
</html>
