{% extends "base.html" %}

{% block content %}
<div class="card mx-auto" style="max-width: 800px;">
  <h3 class="mb-4">Election Logs</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Date</th>
        <th>Success Votes</th>
        <th>Failed Votes</th>
        <th>File</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.timestamp }}</td>
        <td>{{ log.success_count }}</td>
        <td>{{ log.failed_count }}</td>
        <td>{{ log.file_name }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
