<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>OTP Verification</title>

<link rel="stylesheet" href="/static/css/style.css">

<style>
.auth-input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    text-align: center;
    letter-spacing: 5px;
}
</style>

</head>

<body>

<div class="main-wrapper">
<div class="glass-card">

<h1>OTP Verification 🔐</h1>
<p>Enter the OTP sent to your registered mobile</p>

<form method="POST">
    {% csrf_token %}

    <input class="auth-input" type="text" name="otp" placeholder="Enter OTP" required>

    <button type="submit" class="btn-voter" style="width:100%;">
        VERIFY OTP
    </button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

</div>
</div>

</body>
</html>
